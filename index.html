<script>
let invoices = JSON.parse(localStorage.getItem('ik_invoices')||'[]');

let cancelledPVs = JSON.parse(localStorage.getItem('ik_cancelled')||'[]');
let customCats = JSON.parse(localStorage.getItem('ik_cats')||'[]');
let hiddenCats = JSON.parse(localStorage.getItem('ik_cats_hidden')||'[]');
const DEFAULT_CATS = ['stock','kegunaan kedai','utilities','gaji','personal'];
migrateCN();
let tab='all', query='', filters={cat:'',status:'',pay:''}, selected=new Set(), editId=null, pendingImg='', pendingPdf='', pendingPayImg='', pendingPayPdf='', pendingScanMode=false, payMode='single', payTarget=null, imgTarget='invoice';
function allCats(){ const fromInv=invoices.map(x=>(x.cat||'').trim()).filter(Boolean); const m=[...DEFAULT_CATS.filter(c=>!hiddenCats.includes(c))]; [...customCats,...fromInv].forEach(c=>{if(!m.includes(c))m.push(c)}); return m; }
// ===== IndexedDB untuk PDF besar (multi-muka) - localStorage cuma ~5MB, PDF 2MB+ tak muat =====
const IDB_DB='invoiceKedaiDB', IDB_STORE='pdfs';
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open(IDB_DB,1); r.onupgradeneeded=()=>{ try{ if(!r.result.objectStoreNames.contains(IDB_STORE)) r.result.createObjectStore(IDB_STORE); }catch(e){} }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbSavePdf(key, dataUrl){ try{ const db=await idbOpen(); return new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).put(dataUrl, key); tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error); }); }catch(e){ return false; } }
async function idbLoadPdf(key){ try{ const db=await idbOpen(); return new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,'readonly'); const q=tx.objectStore(IDB_STORE).get(key); q.onsuccess=()=>res(q.result||null); q.onerror=()=>rej(q.error); }); }catch(e){ return null; } }
async function idbDeletePdf(key){ try{ const db=await idbOpen(); return new Promise(res=>{ const tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).delete(key); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false); }); }catch(e){} }
async function resolvePdfData(pdfField){
  if(!pdfField) return '';
  if(String(pdfField).startsWith('IDB:')){ const key=String(pdfField).slice(4); const v=await idbLoadPdf(key); return v||''; }
  return pdfField;
}
function save(){ try{ localStorage.setItem('ik_invoices',JSON.stringify(invoices)); }catch(e){
  // Quota penuh - cuba pindah PDF besar dalam localStorage ke IndexedDB, lepas tu try simpan balik
  try{
    invoices.forEach(x=>{
      if(x.pdf && String(x.pdf).startsWith('data:') && x.pdf.length>500*1024){ const k='inv_'+x.id; idbSavePdf(k, x.pdf); x.pdf='IDB:'+k; x.hasPdf=true; }
      if(x.paymentPdf && String(x.paymentPdf).startsWith('data:') && x.paymentPdf.length>500*1024){ const k='pay_'+x.id; idbSavePdf(k, x.paymentPdf); x.paymentPdf='IDB:'+k; }
    });
    localStorage.setItem('ik_invoices',JSON.stringify(invoices));
    showToast('Storage penuh, PDF besar dipindah ke IndexedDB');
  }catch(e2){ alert('Storage iPhone penuh! Padam invoice lama / gambar lama dulu. PDF multi-muka besar tak dapat simpan dalam localStorage.'); throw e2; }
} localStorage.setItem('ik_cancelled',JSON.stringify(cancelledPVs)); localStorage.setItem('ik_cats',JSON.stringify(customCats)); localStorage.setItem('ik_cats_hidden',JSON.stringify(hiddenCats)); }
function fmt(n){ return 'RM'+Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(d){ if(!d) return ''; const parts=String(d).split('-'); if(parts.length!==3) return d; return parts[2]+'/'+parts[1]+'/'+parts[0].slice(2); }
function isCN(o){ return String(o?.inv||'').trim().toUpperCase().startsWith('CN'); }
function signedPrice(o){ const v=Number(o?.price||0); return isCN(o) ? -Math.abs(v) : v; }
function migrateCN(){ let changed=false; invoices.forEach(x=>{ if(isCN(x) && Number(x.price||0)>0){ x.price=-Math.abs(Number(x.price||0)); changed=true; } }); if(changed) save(); }
function today(){ return new Date().toISOString().slice(0,10); }
function showToast(t){ const el=document.getElementById('toast'); el.textContent=t; el.style.display='block'; setTimeout(()=>el.style.display='none',2200); }
function rebuildCatList(){ const sel=document.getElementById('fCat'); if(sel){ const cur=sel.value; sel.innerHTML=allCats().map(c=>`<option value="${c}">${c}</option>`).join(''); if(cur&&allCats().includes(cur))sel.value=cur; } const f=document.getElementById('fltCat'); if(f){ const cur=f.value; f.innerHTML='<option value="">Semua kategori</option>'+allCats().map(c=>`<option value="${c}">${c}</option>`).join(''); if(cur)f.value=cur; } }
function filtered(){ let list=[...invoices]; if(query){ const q=query.toLowerCase(); list=list.filter(x=>(x.name||'').toLowerCase().includes(q)||(x.inv||'').toLowerCase().includes(q)); } if(filters.cat) list=list.filter(x=>x.cat===filters.cat); if(filters.status) list=list.filter(x=>filters.status==='paid'?x.paid:!x.paid); if(filters.pay) list=list.filter(x=>x.payMethod===filters.pay); if(tab==='paid') list=list.filter(x=>x.paid); if(tab==='unpaid') list=list.filter(x=>!x.paid); if(tab==='batal'){ return []; } return list; }
function gotoTab(name){ tab=name; document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.dataset.tab===name)); selected.clear(); render(); }
function render(){
  rebuildCatList();

function processFile(file,isScan,target){

  // Safety: kalau PDF sampai sini terus (bypass override), convert jugak
  if(/\.pdf$/i.test(file.name||'') || file.type==='application/pdf'){ showToast('Baca PDF...'); pdfToImageFile(file).then(f=>{ if(f) processFile(f,isScan,target); }); return; } const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const maxW=2048, sc=Math.min(1,maxW/img.width); const cv=document.createElement('canvas'); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc); const ctx=cv.getContext('2d'); ctx.drawImage(img,0,0,cv.width,cv.height); const out=cv.toDataURL('image/jpeg',0.92); if(target==='pay'){ pendingPayImg=out; deletePayResit=false; const pp=document.getElementById('payThumbPreview'), pi=document.getElementById('payThumbIcon'); pp.src=out; pp.style.display='block'; pi.style.display='none'; updatePayThumbDelete(true); document.getElementById('imgSourceModal').classList.remove('open'); showToast('Gambar dimasukkan'); } else { document.getElementById('imgSourceModal').classList.remove('open'); showCropEditor(out, target, isScan); } }; img.src=r.result; }; r.readAsDataURL(file);
}
async function renderPdfPages(pdfDataUrl){
  const box=document.getElementById('imgViewPdfPages'); if(!box) return;
  box.innerHTML='<p style="padding:20px;color:#666">Loading PDF...</p>';
  try{
    if(!window.pdfjsLib){ const ok=await ensurePdfJs(); if(!ok){
      // Fallback native: Safari boleh render PDF dari blob URL
      const bin=atob(pdfDataUrl.split(',')[1]||''); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      const blob=new Blob([bytes],{type:'application/pdf'}); const url=URL.createObjectURL(blob);
      box.innerHTML='';
      const fr=document.createElement('iframe'); fr.src=url; fr.style.cssText='width:100%;height:65vh;border:0;background:#fff;border-radius:8px';
      box.appendChild(fr);
      const note=document.createElement('p'); note.style.cssText='font-size:12px;color:#666;text-align:center'; note.textContent='PDF dibuka dengan viewer Safari — scroll / pinch zoom macam biasa';
      box.appendChild(note); return;
    } }
    // dataURL -> ArrayBuffer
    const base64=pdfDataUrl.split(',')[1]||'';
    const bin=atob(base64); const len=bin.length; const bytes=new Uint8Array(len);
    for(let i=0;i<len;i++) bytes[i]=bin.charCodeAt(i);
    const pdf=await window.pdfjsLib.getDocument({data: bytes}).promise;
    box.innerHTML='';
    for(let pn=1; pn<=pdf.numPages; pn++){
      const page=await pdf.getPage(pn);
      // Scale 2.2 - tajam macam Smart Receipt, tapi tak berat sangat
      const vp=page.getViewport({scale:2.2});
      const cv=document.createElement('canvas');
      cv.width=Math.round(vp.width); cv.height=Math.round(vp.height);
      cv.style.cssText='width:100%;height:auto;display:block;background:#fff;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.15)';
      const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
      await page.render({canvasContext:ctx, viewport:vp}).promise;
      const wrap=document.createElement('div'); wrap.style.cssText='position:relative';
      wrap.appendChild(cv);
      const lab=document.createElement('div'); lab.textContent='Muka '+pn+' / '+pdf.numPages;
      lab.style.cssText='position:absolute;top:6px;right:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:3px 8px;border-radius:999px';
      wrap.appendChild(lab); box.appendChild(wrap);
    }
  }catch(e){ box.innerHTML='<p style="padding:20px;color:#c00">PDF tak dapat buka: '+(e.message||e)+'</p>'; }
}

// ===== PDF SUPPORT - CamScanner PDF dalam iCloud =====
// iPhone Files grey-out PDF sebab accept="image/*" je dulu. Sekarang accept dah include PDF.
// PDF kena render ke gambar dulu pakai PDF.js, baru masuk flow gambar biasa (crop / thumb).
if(window.pdfjsLib){ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }catch(e){} }
async function ensurePdfJs(){
  if(window.pdfjsLib) return true;
  // Cuba load dari jsdelivr kalau cdnjs fail
  try{
    await new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
      s.onload=()=>{ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'; }catch(e){} res(); };
      s.onerror=()=>rej(new Error('cdn fail'));
      document.head.appendChild(s);
      setTimeout(()=>{ if(window.pdfjsLib) res(); }, 3000);
    });
  }catch(e){}
  return !!window.pdfjsLib;
}
function pdfPlaceholderFile(name){
  const cv=document.createElement('canvas'); cv.width=800; cv.height=1100;
  const c=cv.getContext('2d'); c.fillStyle='#fff'; c.fillRect(0,0,800,1100);
  c.fillStyle='#dc2626'; c.font='bold 120px system-ui'; c.textAlign='center'; c.fillText('PDF',400,450);
  c.fillStyle='#333'; c.font='28px system-ui'; c.fillText((name||'Invoice').slice(0,30),400,550);
  c.fillStyle='#666'; c.font='22px system-ui'; c.fillText('Tekan untuk view PDF',400,600);
  return new Promise(res=>cv.toBlob(b=>res(new File([b], (name||'doc').replace(/\.pdf$/i,'')+'.jpg',{type:'image/jpeg'})),'image/jpeg',0.85));
}
async function pdfToImageFile(file){
  if(!window.pdfjsLib){
    const ok = await ensurePdfJs();
    if(!ok){
      // Fallback: jangan block user - simpan PDF, thumb jadi placeholder PDF, view nanti pakai native Safari PDF viewer
      showToast('PDF.js tak load, simpan PDF je');
      return await pdfPlaceholderFile(file.name);
    }
  }
  try{
    const buf = await file.arrayBuffer();
    const pdf = await window.pdfjsLib.getDocument({data: buf}).promise;
    if(pdf.numPages>1) showToast('PDF ada '+pdf.numPages+' muka, ambil muka 1 je');
    const page = await pdf.getPage(1);
    const scale = 1.8; // Kurang sikit untuk multi-muka - jimat memory iPhone, masih tajam
    const vp = page.getViewport({scale});
    const cv = document.createElement('canvas'); cv.width=Math.round(vp.width); cv.height=Math.round(vp.height);
    const ctx = cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
    await page.render({canvasContext: ctx, viewport: vp}).promise;
    const blob = await new Promise(res=>cv.toBlob(res,'image/jpeg',0.92));
    return new File([blob], file.name.replace(/\.pdf$/i,'')+'.jpg', {type:'image/jpeg'});
  }catch(err){ alert('PDF tak dapat baca: '+(err.message||err)); return null; }
}
// Override processFile for payDetail: if target is payDetail, save to that invoice
const _origProcess = processFile;
processFile = function(file,isScan,target){
  // Kalau PDF, macam Smart Receipt: SIMPAN PDF ASAL + thumb muka 1, SKIP crop (PDF dah straight)
  if(file && (/\.pdf$/i.test(file.name||'') || file.type==='application/pdf')){
    showToast('Baca PDF...');
    const _r=new FileReader();
    _r.onload=()=>{
      const pdfUrl=_r.result;
      if(target==='pay' || target==='payDetail' || target==='payPV'){ pendingPayPdf=pdfUrl; } else { pendingPdf=pdfUrl; }
      pdfToImageFile(file).then(imgFile=>{
        if(!imgFile) return;
        // Baca thumb muka 1 jadi dataURL, terus set tanpa crop
        const _r2=new FileReader();
        _r2.onload=()=>{
          const thumb=_r2.result;
          // Resize sikit untuk jimat storage (max 1600)
          const _im=new Image(); _im.onload=()=>{
            const maxW=1600, sc=Math.min(1,maxW/_im.width);
            const cv=document.createElement('canvas'); cv.width=Math.round(_im.width*sc); cv.height=Math.round(_im.height*sc);
            const cx=cv.getContext('2d'); cx.drawImage(_im,0,0,cv.width,cv.height);
            const out=cv.toDataURL('image/jpeg',0.88);
            document.getElementById('imgSourceModal').classList.remove('open');
            if(target==='pay'){
              pendingPayImg=out; deletePayResit=false;
              const pp=document.getElementById('payThumbPreview'), pi=document.getElementById('payThumbIcon');
              if(pp){ pp.src=out; pp.style.display='block'; } if(pi) pi.style.display='none'; updatePayThumbDelete(true);
              showToast('PDF dimasukkan');
            } else if(target==='payDetail'){
              const inv=invoices.find(x=>x.id===window._payDetailId);
              if(inv){ inv.paymentImg=out; if(pendingPayPdf) inv.paymentPdf=pendingPayPdf; save(); render(); openDetail(inv.id); showToast('Resit PDF disimpan'); }
            } else if(target==='payPV'){
              const pvInfo=window._payPV;
              if(pvInfo){ const items=invoices.filter(x=>x.paid&&x.pv===pvInfo.pv&&x.payDate===pvInfo.payDate); items.forEach(x=>{ x.paymentImg=out; if(pendingPayPdf) x.paymentPdf=pendingPayPdf; }); if(items.length){ save(); render(); openPVDetail(pvInfo.pv,pvInfo.payDate); showToast('Resit PDF disimpan - '+items.length+' invoice'); } }
            } else {
              // Invoice biasa - terus set thumb, tak payah crop macam Smart Receipt
              pendingImg=out; setThumb(out); showToast('PDF dimasukkan - tekan gambar untuk view PDF');
            }
          }; _im.src=thumb;
        }; _r2.readAsDataURL(imgFile);
      });
    };
    _r.readAsDataURL(file);
    return;
  }
  // Kalau pilih gambar biasa, clear PDF lama supaya tak tertinggal PDF lama
  if(target==='pay' || target==='payDetail' || target==='payPV'){ pendingPayPdf=''; } else if(target==='invoice' || !target || target===''){ pendingPdf=''; }
  if(target==='payDetail'){
    if(!file) return; const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const maxW=1600, sc=Math.min(1,maxW/img.width); const cv=document.createElement('canvas'); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc); const ctx=cv.getContext('2d'); ctx.drawImage(img,0,0,cv.width,cv.height); const out=cv.toDataURL('image/jpeg',0.85); const inv=invoices.find(x=>x.id===window._payDetailId); if(inv){ inv.paymentImg=out; if(pendingPayPdf) inv.paymentPdf=pendingPayPdf; save(); render(); openDetail(inv.id); showToast('Resit Payment disimpan'); } }; img.src=r.result; }; r.readAsDataURL(file); return;
  }
  if(target==='payPV'){
    if(!file) return; const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const maxW=1600, sc=Math.min(1,maxW/img.width); const cv=document.createElement('canvas'); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc); const ctx=cv.getContext('2d'); ctx.drawImage(img,0,0,cv.width,cv.height); const out=cv.toDataURL('image/jpeg',0.85); const pvInfo=window._payPV; if(pvInfo){ const items=invoices.filter(x=>x.paid&&x.pv===pvInfo.pv&&x.payDate===pvInfo.payDate); items.forEach(x=>{ x.paymentImg=out; if(pendingPayPdf) x.paymentPdf=pendingPayPdf; }); if(items.length){ save(); render(); openPVDetail(pvInfo.pv,pvInfo.payDate); showToast('Resit Payment disimpan - '+items.length+' invoice'); } } }; img.src=r.result; }; r.readAsDataURL(file); return;
  }
  _origProcess(file,isScan,target);
};

  selected.clear(); save(); document.getElementById('payModal').classList.remove('open');

  else { showToast(`Bayar siap - ${pv} - ${items.length} invoice`); gotoTab('paid'); }
};

function solveHomography(src, dst){
  const A=[]; const b=[];
  for(let i=0;i<4;i++){ const x=src[i].x, y=src[i].y, u=dst[i].x, v=dst[i].y; A.push([x,y,1,0,0,0,-u*x,-u*y]); b.push(u); A.push([0,0,0,x,y,1,-v*x,-v*y]); b.push(v); }
  const n=8; const M=[]; for(let i=0;i<n;i++){ M.push(A[i].concat([b[i]])); }
  for(let i=0;i<n;i++){ let piv=i; for(let r=i+1;r<n;r++) if(Math.abs(M[r][i])>Math.abs(M[piv][i])) piv=r; const tmp=M[i]; M[i]=M[piv]; M[piv]=tmp; const d=M[i][i]; if(Math.abs(d)<1e-9) return null; for(let j=i;j<=n;j++) M[i][j]/=d; for(let r=0;r<n;r++){ if(r===i) continue; const f=M[r][i]; for(let j=i;j<=n;j++) M[r][j]-=f*M[i][j]; } }
  const h=[]; for(let i=0;i<n;i++) h.push(M[i][n]); h.push(1); return h;
}
function invert3x3(m){
  const a=m[0],b=m[1],c=m[2],d=m[3],e=m[4],f=m[5],g=m[6],h=m[7],i=m[8];
  const A=e*i-f*h, B=-(d*i-f*g), C=d*h-e*g; const det=a*A+b*B+c*C; if(Math.abs(det)<1e-9) return null;
  const inv=1/det; return [A*inv, -(b*i-c*h)*inv, (b*f-c*e)*inv, B*inv, (a*i-c*g)*inv, -(a*f-c*d)*inv, C*inv, -(a*h-b*g)*inv, (a*e-b*d)*inv];
}
function warpPerspective(dataUrl, quadPct, cb){
  if(!quadPct || quadPct.length!==4) quadPct=[{x:0,y:0},{x:100,y:0},{x:100,y:100},{x:0,y:100}];
  const im=new Image(); im.onload=()=>{
    const maxW=2048; const sc=Math.min(1, maxW/im.width); const sw=Math.round(im.width*sc), sh=Math.round(im.height*sc);
    const srcCv=document.createElement('canvas'); srcCv.width=sw; srcCv.height=sh; const sctx=srcCv.getContext('2d'); sctx.drawImage(im,0,0,sw,sh);
    const srcData=sctx.getImageData(0,0,sw,sh).data;
    const q=quadPct.map(p=>({x:p.x/100*sw, y:p.y/100*sh}));
    const topLen=Math.hypot(q[1].x-q[0].x, q[1].y-q[0].y); const botLen=Math.hypot(q[2].x-q[3].x, q[2].y-q[3].y);
    const leftLen=Math.hypot(q[3].x-q[0].x, q[3].y-q[0].y); const rightLen=Math.hypot(q[2].x-q[1].x, q[2].y-q[1].y);
    const outW=Math.max(200, Math.round((topLen+botLen)/2)); const outH=Math.max(200, Math.round((leftLen+rightLen)/2));
    const dst=[{x:0,y:0},{x:outW,y:0},{x:outW,y:outH},{x:0,y:outH}];
    const H=solveHomography(q, dst); const Hinv=invert3x3(H); if(!Hinv){ cb(dataUrl); return; }
    const outCv=document.createElement('canvas'); outCv.width=outW; outCv.height=outH; const octx=outCv.getContext('2d');
    const outImg=octx.createImageData(outW,outH); const od=outImg.data;
    for(let y=0;y<outH;y++){ for(let x=0;x<outW;x++){ const denom=Hinv[6]*x+Hinv[7]*y+Hinv[8]; const sx=(Hinv[0]*x+Hinv[1]*y+Hinv[2])/denom; const sy=(Hinv[3]*x+Hinv[4]*y+Hinv[5])/denom; const idx=(y*outW+x)*4; if(sx<0||sy<0||sx>=sw-1||sy>=sh-1){ od[idx+3]=0; continue; } const x0=Math.floor(sx), y0=Math.floor(sy); const fx=sx-x0, fy=sy-y0; for(let c=0;c<3;c++){ const p00=srcData[(y0*sw+x0)*4+c], p10=srcData[(y0*sw+Math.min(sw-1,x0+1))*4+c]; const p01=srcData[(Math.min(sh-1,y0+1)*sw+x0)*4+c], p11=srcData[(Math.min(sh-1,y0+1)*sw+Math.min(sw-1,x0+1))*4+c]; const val=(p00*(1-fx)+p10*fx)*(1-fy)+(p01*(1-fx)+p11*fx)*fy; od[idx+c]=val; } od[idx+3]=255; } }
    octx.putImageData(outImg,0,0); cb(outCv.toDataURL('image/jpeg',0.92));
  }; im.src=dataUrl;
}
